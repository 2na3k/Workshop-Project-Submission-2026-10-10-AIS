[project]
name = "remy"
version = "0.1.0"
description = "Remy weekly planner monorepo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph",
    "langgraph-checkpoint",
    "langgraph-checkpoint-postgres",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "remy/api",
    "remy/workflows",
    "remy/data-crawler",
    "remy/data-preparation",
]
