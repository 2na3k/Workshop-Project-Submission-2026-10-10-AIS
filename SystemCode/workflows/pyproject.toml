[project]
name = "foodie-workflows"
version = "0.1.0"
description = "LangGraph workflows for Foodie"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]
