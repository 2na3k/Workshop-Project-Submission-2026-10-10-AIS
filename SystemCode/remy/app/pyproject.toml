[project]
name = "remy-app"
version = "0.1.0"
description = "Remy composition root"
requires-python = ">=3.12,<3.13"
dependencies = [
    "remy-api",
    "remy-workflows",
]

[tool.uv.sources]
remy-api = { workspace = true }
remy-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
