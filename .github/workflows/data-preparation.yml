name: data-preparation

# Test infrastructure for the dbt / Neo4j serving pipeline (p1-001b).
# Unit and orchestration tests run first; the cloud Neo4j integration tests run
# second, against the dedicated test instance supplied by repository secrets.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SystemCode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync workspace dependencies
        run: uv sync --all-packages

      # Orchestration and unit tests: must never need a live Neo4j.
      - name: Unit tests
        run: uv run --package remy-data-preparation pytest -q remy/data-preparation/tests -m "not integration"

      # Integration tests against the dedicated cloud Neo4j test instance.
      # CI=true makes the fixture fail (not skip) when a secret is missing, so
      # an unconfigured instance turns this step red rather than silently green.
      - name: Integration tests
        env:
          CI: "true"
          NEO4J_TEST_URI: ${{ secrets.NEO4J_TEST_URI }}
          NEO4J_TEST_USERNAME: ${{ secrets.NEO4J_TEST_USERNAME }}
          NEO4J_TEST_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}
        run: uv run --package remy-data-preparation pytest -q remy/data-preparation/tests -m integration
