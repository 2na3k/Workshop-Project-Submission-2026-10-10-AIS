version: 2

models:
  - name: recipe_graph_to_neo4j
    description: "Loads the seven recipe graph mart relations into Neo4j and records loaded row counts."
    columns:
      - name: entity
        description: "Neo4j node label or relationship type loaded."
        tests: [not_null, unique]
      - name: loaded_rows
        description: "Number of source mart rows loaded."
        tests: [not_null]
