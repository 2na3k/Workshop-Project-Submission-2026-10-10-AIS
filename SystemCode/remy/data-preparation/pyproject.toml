[project]
name = "remy-data-preparation"
version = "0.1.0"
description = "dbt project for Remy data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.8,<2",
    "dbt-duckdb>=1.11,<2",
    "neo4j>=6,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "python-dotenv>=1,<2"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live Neo4j instance (skipped locally when NEO4J_TEST_URI is not configured; fails in CI when unconfigured)",
]

[tool.mypy]
mypy_path = "scripts"
files = ["scripts", "tests"]
