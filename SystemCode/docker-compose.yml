services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remy
      POSTGRES_PASSWORD: ${REMY_POSTGRES_PASSWORD:-remy}
    volumes:
      - remy_postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty volume. It creates the remy_main database itself.
      - ./remy/backend/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      # -h forces TCP, which only opens after the init script has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "remy", "-d", "remy_main"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: remy/backend/Dockerfile
    env_file:
      - path: remy/backend/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      REMY_DATABASE_URL: postgresql://remy:${REMY_POSTGRES_PASSWORD:-remy}@postgres:5432/remy_main
      REMY_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: remy/api/Dockerfile
    env_file:
      # start-all.sh points this at remy/api/.env; the Makefile keeps .env.nonprod.
      - path: ${REMY_API_ENV_FILE:-.env.nonprod}
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT:-8081}:8000"
    depends_on:
      neo4j:
        condition: service_started
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: remy/frontend
      args:
        # The browser calls the auth backend directly, so this is a host URL.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8010}
        # /api/v1 is proxied by the Next server, inside the Compose network.
        REMY_API_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/signin"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-crawler:
    profiles: [jobs]
    build:
      context: .
      dockerfile: remy/data-crawler/Dockerfile
    env_file:
      - .env.nonprod
    environment:
      PYTHONUNBUFFERED: "1"
    restart: "no"

  data-preparation:
    profiles: [jobs]
    build:
      context: .
      dockerfile: remy/data-preparation/Dockerfile
    env_file:
      - .env.nonprod
    environment:
      PYTHONUNBUFFERED: "1"
    restart: "no"

  neo4j:
    profiles: [neo4j]
    image: neo4j:5-community
    container_name: remy-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 5g
      NEO4J_server_memory_pagecache_size: 1g
      NEO4J_dbms_memory_transaction_total_max: 5g
    volumes:
      - remy_neo4j_data:/data
      - remy_neo4j_logs:/logs

volumes:
  remy_postgres_data:
  remy_neo4j_data:
  remy_neo4j_logs:
